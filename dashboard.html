<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS // Cyber Dashboard</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(16, 20, 28, 0.7);
    --panel-border: rgba(0, 240, 255, 0.2);
    --panel-border-glow: rgba(0, 240, 255, 0.5);
    --cyan: #00f0ff;
    --magenta: #ff007f;
    --violet: #7000ff;
    --green: #00ff88;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-faint: #475569;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
      linear-gradient(180deg, rgba(11, 13, 18, 0.8) 0%, rgba(11, 13, 18, 0.95) 100%),
      url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-ui);
    padding: clamp(16px, 4vw, 40px);
    overflow-x: hidden;
  }

  .wrap { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 22px 24px;
    transition: all .35s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .panel:hover {
    border-color: var(--panel-border-glow);
    box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 15px rgba(0, 240, 255, 0.2);
  }

  .panel-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cyan); font-weight: 600; margin: 0 0 16px 0;
    font-family: var(--font-mono);
  }
  .panel-title .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  }

  /* CONTROLES DE SONIDO */
  .sound-controls {
    position: absolute; top: 20px; right: 24px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border);
    padding: 6px 14px; border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 0.75rem;
  }
  .sound-controls input[type="range"] {
    width: 90px; accent-color: var(--cyan); cursor: pointer;
  }

  /* HUD HEADER */
  header.hud {
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 20px; padding: 26px 34px; margin-bottom: 22px;
  }
  .greeting { font-size: 1.8rem; font-weight: 700; }
  .greeting .accent { color: var(--cyan); text-shadow: 0 0 12px rgba(0,240,255,0.5); }
  .date-line { color: var(--text-dim); font-size: 0.92rem; font-family: var(--font-mono); }
  .clock {
    font-size: 3rem; font-weight: 700; font-family: var(--font-mono);
    color: #fff; text-shadow: 0 0 15px rgba(0,240,255,0.4);
  }
  .clock .sec { color: var(--cyan); }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
  .card-todo { grid-column: span 5; }
  .card-links { grid-column: span 7; }
  .card-timer { grid-column: span 4; }
  .card-notes { grid-column: span 8; }

  @media (max-width: 980px) {
    .card-todo, .card-links, .card-timer, .card-notes { grid-column: span 12; }
  }

  /* INPUTS Y BOTONES */
  .input-box, .notes-textarea {
    background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm); padding: 11px 14px; color: var(--text);
    font-size: 0.95rem; outline: none; transition: all .25s ease;
  }
  .input-box:focus, .notes-textarea:focus {
    border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.3);
  }

  .btn {
    border: 1px solid var(--panel-border); border-radius: var(--radius-sm);
    padding: 10px 18px; font-weight: 600; font-size: 0.88rem; cursor: pointer;
    background: rgba(0,240,255,0.1); color: var(--cyan); transition: all .2s ease;
  }
  .btn:hover { background: rgba(0,240,255,0.25); box-shadow: 0 0 10px rgba(0,240,255,0.4); }

  .todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .todo-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm); padding: 10px 12px;
  }

  .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
  .link-card {
    background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border);
    border-radius: var(--radius-md); padding: 18px 12px; text-align: center;
    color: var(--text); text-decoration: none; transition: all .22s ease;
  }
  .link-card:hover { border-color: var(--cyan); transform: translateY(-3px); box-shadow: 0 0 12px rgba(0,240,255,0.3); }

  .timer-display { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; color: var(--cyan); text-align: center; margin-bottom: 12px; }
  .notes-textarea { width: 100%; min-height: 180px; font-family: var(--font-mono); resize: vertical; }
</style>
</head>
<body>

<div class="wrap">
  <header class="hud panel">
    <div class="sound-controls">
      <span>🔊 VOL:</span>
      <input type="range" id="volumeSlider" min="0" max="200" value="100">
      <span id="volumeVal" style="width: 38px;">100%</span>
    </div>
    <div>
      <div class="greeting">System // <span class="accent">Online</span></div>
      <div class="date-line" id="dateLine">Loading...</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <main class="grid">
    <section class="panel card-todo">
      <h2 class="panel-title"><span class="dot"></span>Tasks</h2>
      <div style="display:flex; gap:10px; margin-bottom:14px;">
        <input type="text" id="todoInput" class="input-box" style="flex:1;" placeholder="Add new task...">
        <button class="btn" id="todoAddBtn">Add</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
    </section>

    <section class="panel card-links">
      <h2 class="panel-title"><span class="dot"></span>Navigation Shortcuts</h2>
      <div class="links-grid" id="linksGrid"></div>
    </section>

    <section class="panel card-timer">
      <h2 class="panel-title"><span class="dot"></span>Focus Timer</h2>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div style="display:flex; justify-content:center; gap:10px;">
        <button class="btn" id="timerStartBtn">Start</button>
        <button class="btn" id="timerResetBtn">Reset</button>
      </div>
    </section>

    <section class="panel card-notes">
      <h2 class="panel-title"><span class="dot"></span>Scratchpad (ASMR Enabled)</h2>
      <textarea class="notes-textarea" id="notesArea" placeholder="Type here to trigger mechanical switch audio..."></textarea>
    </section>
  </main>
</div>

<script>
/* ==========================================================
   ASMR AUDIO ENGINE WITH UP TO 200% VOLUME CONTROL
========================================================== */
let volumeLevel = 1.0; // 1.0 = 100%, 2.0 = 200%
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Sonido de tecla mecánica (ASMR Key Press)
function playKeyPressSound() {
  if (volumeLevel <= 0) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    const freq = 160 + Math.random() * 120;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.04);
    
    // Aplicar multiplicador de volumen (hasta 200%)
    const baseGain = 0.08 * volumeLevel;
    gain.gain.setValueAtTime(baseGain, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.04);
  } catch(e){}
}

// Sonido para clics e interacciones de la interfaz
function playClickSound() {
  if (volumeLevel <= 0) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.05);
    
    const baseGain = 0.1 * volumeLevel;
    gain.gain.setValueAtTime(baseGain, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  } catch(e){}
}

// Control del slider de volumen (0% a 200%)
const volumeSlider = document.getElementById('volumeSlider');
const volumeVal = document.getElementById('volumeVal');

volumeSlider.addEventListener('input', (e) => {
  const val = parseInt(e.target.value, 10);
  volumeLevel = val / 100; // 200 = 2.0
  volumeVal.textContent = val + '%';
});

// Eventos de teclado
document.getElementById('todoInput').addEventListener('keydown', playKeyPressSound);
document.getElementById('notesArea').addEventListener('keydown', playKeyPressSound);

/* ==========================================================
   UI CORE & LOGIC
========================================================== */
function updateClock(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').innerHTML = `${h}:${m}<span class="sec">:${s}</span>`;
  document.getElementById('dateLine').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
}
setInterval(updateClock, 1000); updateClock();

const links = [
  { label: 'GitHub', url: 'https://github.com' },
  { label: 'YouTube', url: 'https://youtube.com' },
  { label: 'Google', url: 'https://google.com' },
  { label: 'ChatGPT', url: 'https://chat.openai.com' },
  { label: 'Roblox', url: 'https://roblox.com' }
];
const linksGrid = document.getElementById('linksGrid');
links.forEach(l => {
  const a = document.createElement('a');
  a.href = l.url; a.target = '_blank'; a.className = 'link-card';
  a.textContent = l.label;
  a.addEventListener('click', playClickSound);
  linksGrid.appendChild(a);
});

// Tasks
const todoInput = document.getElementById('todoInput');
const todoList = document.getElementById('todoList');
document.getElementById('todoAddBtn').addEventListener('click', () => {
  if(!todoInput.value.trim()) return;
  playClickSound();
  const li = document.createElement('li'); li.className = 'todo-item';
  li.innerHTML = `<span>${todoInput.value}</span>`;
  todoList.appendChild(li);
  todoInput.value = '';
});

// Timer
let timerTime = 25 * 60, timerInterval = null;
document.getElementById('timerStartBtn').addEventListener('click', () => {
  playClickSound();
  if(timerInterval) { clearInterval(timerInterval); timerInterval = null; return; }
  timerInterval = setInterval(() => {
    if(timerTime > 0) {
      timerTime--;
      const m = String(Math.floor(timerTime / 60)).padStart(2,'0');
      const s = String(timerTime % 60).padStart(2,'0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }
  }, 1000);
});
document.getElementById('timerResetBtn').addEventListener('click', () => {
  playClickSound();
  clearInterval(timerInterval); timerInterval = null; timerTime = 25 * 60;
  document.getElementById('timerDisplay').textContent = "25:00";
});
</script>
</body>
</html>
